
name: ChalanCheck CI

on:
  push:
    branches:
      - main
      - "feature/**"
  pull_request:
    branches:
      - main

jobs:
  lint-and-test:
    name: Ruff and Pytest
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install ruff pytest httpx
          python -m pip install google-genai
          python -m pip install fastapi requests certifi PyMuPDF python-dotenv
          python -m pip show google-genai

      - name: Verify Google GenAI import
        run: |
          python -c "from google import genai; print('Google GenAI import successful')"

      - name: Run Ruff
        run: python -m ruff check .

      - name: Run Pytest
        run: python -m pytest -q



      - name: Run Ruff
        run: ruff check .

      - name: Run Pytest
        run: python -m pytest -q

  docker-build:
    name: Docker Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: false
          tags: chalancheck:ci
