
services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    env_file:
      - path: .env
        required: false
    environment:
      PYTHONUNBUFFERED: "1"
    volumes:
      - ./data:/app/data
    command: >
      python -m uvicorn app.main:app
      --host 0.0.0.0
      --port 8000

  ui:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8501:8501"
    environment:
      API_BASE_URL: http://api:8000
      PYTHONUNBUFFERED: "1"
    volumes:
      - ./data:/app/data
    depends_on:
      - api
    command: >
      python -m streamlit run ui/app.py
      --server.address 0.0.0.0
      --server.port 8501
      --server.headless true
